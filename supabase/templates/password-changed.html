<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Huddle password was changed</title>
  </head>
  <body style="margin: 0; background: #f5f7f4; color: #111915; font-family: Arial, sans-serif">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f5f7f4"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              border: 1px solid #dbe2dc;
              border-radius: 24px;
              background: #ffffff;
            "
          >
            <tr>
              <td style="padding: 32px 32px 12px">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td>
                      <img
                        src="{{ .SiteURL }}/brand/huddle-email-icon.png"
                        alt=""
                        width="40"
                        height="40"
                        style="display: block; border: 0"
                      />
                    </td>
                    <td style="padding-left: 12px; font-size: 21px; font-weight: 700">Huddle</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px 36px">
                <p style="margin: 0 0 10px; color: #137a43; font-size: 13px; font-weight: 700">
                  SECURITY NOTICE
                </p>
                <h1 style="margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -0.6px">
                  Your password was changed
                </h1>
                <p style="margin: 18px 0 0; color: #56625b; font-size: 16px; line-height: 1.65">
                  The password for your Huddle account was changed. Sign in again only on devices
                  you still trust.
                </p>
                <p style="margin: 22px 0 0; color: #111915; font-size: 16px; font-weight: 700">
                  If this wasn’t you, reset your password immediately.
                </p>
                <p style="margin: 28px 0">
                  <a
                    data-primary-action="true"
                    href="{{ .SiteURL }}/auth/forgot-password"
                    style="
                      display: inline-block;
                      border-radius: 12px;
                      background: #25dc78;
                      color: #0b1510;
                      padding: 14px 22px;
                      font-size: 15px;
                      font-weight: 700;
                      text-decoration: none;
                    "
                    >Secure my account</a
                  >
                </p>
                <p
                  style="
                    margin: 0;
                    border-top: 1px solid #e5e9e6;
                    padding-top: 20px;
                    color: #778079;
                    font-size: 13px;
                    line-height: 1.6;
                  "
                >
                  If you made this change, no further action is needed.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
