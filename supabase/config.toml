# Local-only Supabase configuration. Hosted projects are created and linked in D02.
project_id = "huddle"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Huddle has no realtime or object-storage feature in the submitted MVP.
[realtime]
enabled = false

[storage]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captures local verification mail without sending it externally.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/reset-password/callback",
  "http://127.0.0.1:3000/auth/reset-password/confirm",
  "http://127.0.0.1:3000/auth/verify/callback",
  "http://127.0.0.1:3000/auth/verify/confirm",
  "http://localhost:3000",
  "http://localhost:3000/auth/reset-password/callback",
  "http://localhost:3000/auth/reset-password/confirm",
  "http://localhost:3000/auth/verify/callback",
  "http://localhost:3000/auth/verify/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 15
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your Huddle account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Huddle password"
content_path = "./supabase/templates/recovery.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Huddle password was changed"
content_path = "./templates/password-changed.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = false

[analytics]
enabled = false
