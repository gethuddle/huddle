name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and component tests with coverage
        run: npm run test:coverage

      - name: Upload non-sensitive coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Start repository-managed local Supabase
        run: npm run db:start

      - name: Reset migrations and deterministic seed
        run: npm run db:reset

      - name: Run pgTAP database tests
        run: npm run test:db

      - name: Reject generated database type drift
        run: npm run db:types:check

      - name: Build with local-only Supabase configuration
        run: npm run build:local

      - name: Install the pinned Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run local authentication end to end
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
